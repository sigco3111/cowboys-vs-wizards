<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카우보이 vs. 마법사</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>/* Shared base for the graybox page: theme variables, resets, buttons, focus, the title menu,
   page headers and the card-type frames. Showdown, Camp and the deck builder build on it
   (src/ui/showdown.css). The lane board rules were removed with the lane duel (#143 slice 3). */
:root {
  color-scheme: dark;
  font: 15px/1.45 system-ui, sans-serif;
  background: #17191d;
  color: #f2f2f4;
  --panel: #25282e;
  --line: #444951;
  --muted: #c5c9d0;
  --cowboy: #e7b878;
  --wizard: #c6b2ee;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
button, input { font: inherit; }
button {
  min-height: 40px;
  padding: .45rem .8rem;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
button:disabled { cursor: default; opacity: .6; }
button:not(:disabled):hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.3rem, 3vw, 2rem); }
#title-screen { max-width: 920px; margin: auto; padding: clamp(1rem, 3vw, 2rem); }
.title-scene { display: grid; gap: 1rem; }
.title-scene nav { display: flex; flex-wrap: wrap; gap: .5rem; }
header { display: flex; align-items: center; justify-content: space-between; gap: .65rem; }

/* Card categories: the frame says the type (docs/card-types.csv, src/ui/card-frames.js). */
[data-frame=spell] { border-style: double; border-width: 4px; }
[data-frame=trap] { border-style: dashed; border-width: 2px; }
[data-frame=wanted], [data-frame=captured] { border-style: solid; border-width: 3px; }
[data-frame=wanted]::before, [data-frame=captured]::before { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .14em; border-bottom: 1px solid currentColor; margin-bottom: .15rem; }
[data-frame=wanted]::before { content: "현상 수배"; }
[data-frame=captured]::before { content: "생포"; }

/* Showdown duel (issue 143 slice 1), scoped to #showdown; Camp (slice 2) at the end. Layout from prototypes/showdown/style.css;
   troop, spell and trap borders come from the [data-frame] rules in graybox.css. */
#showdown { max-width: 920px; margin: auto; padding: clamp(1rem, 3vw, 2rem); display: grid; gap: .5rem; }
#showdown h2 { font-size: 1rem; margin: .75rem 0 .25rem; }
#sd-lesson { font-size: 1.05rem; }
#sd-status { font-weight: 600; }
#sd-feedback { min-height: 1.4rem; color: var(--muted); font-size: .92rem; }
#sd-board { display: grid; gap: .5rem; }
.sd-side { display: grid; grid-template-columns: 9rem repeat(3, 1fr); gap: .5rem; align-items: stretch; }
.sd-base, .sd-slot, .sd-card { padding: .6rem; text-align: left; min-height: 9rem; display: block; }
.sd-card { width: 9rem; min-height: 5.25rem; }
.sd-base strong, .sd-slot strong, .sd-card strong { display: block; }
.wizard strong { color: var(--wizard); } .cowboy strong { color: var(--cowboy); }
.sd-orbs { letter-spacing: .12em; } .sd-lost { opacity: .35; }
.sd-pick { outline: 2px solid #fff; } .sd-can { border-color: #8fd18f; } .sd-chosen { outline: 2px solid var(--cowboy); }
.sd-note { display: block; font-size: .82rem; color: var(--muted); margin-top: .2rem; }
.sd-warn { color: #f0a08a; } .sd-good { color: #9fe09f; }
.sd-type { display: block; font-size: .78rem; letter-spacing: .03em; color: var(--muted); }
.sd-key { display: inline-block; font-size: .78rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 .3rem; }
.sd-result { font-size: 1.2rem; }
.sd-backs { display: flex; gap: 2px; margin-top: .2rem; }
.sd-backs .card-back { width: 14px; height: 20px; border: 1px solid var(--line); border-radius: 2px; }
#sd-prompt { min-height: 1.5rem; }
.sd-row, #sd-hand { display: flex; gap: .5rem; flex-wrap: wrap; }
#sd-log { list-style: none; margin: 0; padding: 0; font-size: .92rem; color: var(--muted); max-height: 14rem; overflow: auto; }
#sd-log .sd-turn { margin-top: .35rem; font-weight: 600; color: inherit; }
#sd-keywords { margin: 0; padding-left: 1.25rem; font-size: .92rem; }
/* Gear and locations by their border, as in the reference screen. */
#showdown [data-frame=gear] { border-style: dotted; border-width: 3px; }
#showdown [data-frame=location] { border-width: 1px 1px 5px; }
@media (max-width: 40rem) { .sd-side { grid-template-columns: 1fr 1fr; } }
/* Camp (issue 143 slice 2): the same graybox layout, with the Trail as a row of plain tiles. */
#showdown-camp { max-width: 920px; margin: auto; padding: clamp(1rem, 3vw, 2rem); display: grid; gap: .5rem; }
#showdown-camp h2 { font-size: 1rem; margin: .75rem 0 .25rem; }
#camp-trail { list-style: none; margin: 0; padding: 0; }
.sd-tile { width: 9.5rem; min-height: 5.25rem; padding: .6rem; text-align: left; display: block; }
.sd-tile strong { display: block; }
.sd-tile.open { border-color: #8fd18f; } .sd-tile.locked { opacity: .6; }
/* Placeholder cues before any 3D work (src/ui/showdown-cues.js): an outline flash on the place an
   event touched and a marked log line. Reduced motion, or .sd-cue-still, shows the outline without the flash. */
#sd-cue { min-height: 1.4rem; margin: 0; font-size: .9rem; }
.sd-cue-label { display: inline-block; border: 1px solid #f2d27a; border-radius: 4px; padding: 0 .35rem; color: #f2d27a; }
#showdown .sd-cue { outline: 3px solid #f2d27a; outline-offset: 2px; animation: sd-cue-flash .7s ease-out; }
#sd-log li[data-cue-kind] { border-left: 3px solid var(--line); padding-left: .35rem; }
#sd-log li.sd-cue { outline: none; border-left-color: #f2d27a; color: inherit; }
#showdown .sd-cue-still { animation: none; }
@keyframes sd-cue-flash { from { outline-color: #fff; background-color: rgba(242, 210, 122, .25); } to { outline-color: #f2d27a; } }
@media (prefers-reduced-motion: reduce) { #showdown .sd-cue { animation: none; } }
/* Slice 3: Camp rows for rivals and Wanted, the deck builder and the two-player curtain, as in prototypes/showdown/style.css. */
#camp-rivals, #camp-bounties { list-style: none; margin: 0; padding: 0; }
#showdown-builder { max-width: 920px; margin: auto; padding: clamp(1rem, 3vw, 2rem); display: grid; gap: .5rem; }
.sd-build-row { display: grid; grid-template-columns: 10rem repeat(2, auto) 1fr; gap: .75rem; align-items: center; margin-bottom: .5rem; }
.sd-build-row .sd-card { width: 10rem; }
#camp-code, #camp-report-text { width: 100%; box-sizing: border-box; }
#sd-curtain { display: grid; gap: 1rem; justify-items: start; padding: 3rem 0; font-size: 1.15rem; }
@media (max-width: 40rem) { .sd-build-row { grid-template-columns: 1fr 1fr; } }
/* Sheriff's Ledger (The Night Shift, src/ui/sheriffs-ledger.js): collapsed at the end of the Camp; fits 390px. */
.sd-ledger h3 { font-size: .95rem; margin: .6rem 0 .2rem; }
.sd-ledger-props { margin: 0; padding-left: 1.1rem; font-size: .82rem; color: var(--muted); }
.sd-ledger-wrap { max-width: 100%; overflow-x: auto; }
.sd-ledger-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.sd-ledger-table th, .sd-ledger-table td { text-align: left; vertical-align: top; padding: .3rem .4rem; border-top: 1px solid var(--line); }
.sd-ledger-table th[scope=row] { font-weight: normal; }
.sd-ledger-src, .sd-ledger code { overflow-wrap: anywhere; }
/* The Ledger uses the same card paintings as the illustrated Camp. */
.sd-billy { display: grid; gap: .5rem; margin: .5rem 0 1rem; padding: clamp(.7rem, 2vw, 1.25rem); border-block: 1px solid var(--line); }
.sd-ledger .sd-billy h3 { font: bold clamp(1.25rem,3vw,1.8rem) Georgia, serif; margin: 0; }
.sd-billy :is(p, h4, dl, dd) { margin: 0; }
.sd-billy button[aria-pressed=true] { border-color: var(--cowboy); box-shadow: inset 0 -3px var(--cowboy); }
.sd-billy button[aria-disabled=true] { opacity: .65; }
.sd-billy-board, .sd-billy-portraits { display: grid; grid-template-columns: minmax(0,1fr) 1.5rem minmax(0,1fr); gap: .3rem; max-width: 32rem; }
.sd-billy-portraits { display: none; }
.sd-billy-portraits:has(.sd-card-art) { display: grid; margin-top: .4rem; }
.sd-billy-portraits > :last-child { grid-column: 3; }
.sd-billy-portraits .sd-card-art { margin: 0; aspect-ratio: 1.65; }
.sd-billy-troop { display: grid; align-content: start; gap: .1rem; min-width: 0; padding: .35rem .5rem; border-bottom: 2px solid var(--line); }
.sd-billy-troop strong { font-size: 1.1rem; }
.sd-billy-vs { align-self: center; text-align: center; font-size: .82rem; color: var(--muted); }
.sd-billy-acting { border-color: var(--cowboy); }
.sd-billy-hit { border-color: #f2d27a; }
.sd-billy-down { border-color: var(--wizard); }
.sd-billy-now { min-height: 1.8em; font-weight: 600; }
.sd-billy h4 { padding-top: .5rem; }
.sd-billy-scores { display: flex; flex-wrap: wrap; gap: .5rem 2.2rem; }
.sd-billy-scores dt { color: var(--muted); font-size: .83rem; }
.sd-billy-scores dd { font-size: 1.35rem; font-weight: bold; }
.sd-billy-evidence { font-size: .85rem; }
.sd-billy-evidence p { margin-top: .45rem; }
/* Seat audit detail: a compact table that stays inside 390px; numbers line up by column. */
.sd-billy-seat summary { cursor: pointer; }
.sd-billy-seat .sd-ledger-wrap { margin-top: .45rem; }
.sd-billy-seat-table { max-width: 32rem; }
.sd-billy-seat-table caption { text-align: left; color: var(--muted); font-size: .82rem; padding-bottom: .2rem; }
.sd-billy-seat-table :is(td, th[scope=col]:not(:first-child)) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sd-billy-seat-finding { font-weight: 600; }
.sd-billy-seat-verify code { overflow-wrap: anywhere; }

</style>
