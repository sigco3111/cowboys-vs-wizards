<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부트 힐 포커 BBS</title>
  <style>
    .w { display: inline-block; width: 2ch; text-align: center; }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(ellipse at center, #2a1706 0%, #0d0702 65%, #000 100%);
      color: #ffb347;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    }
    .crt {
      position: relative;
      max-width: 100%;
      padding: 22px 26px 18px;
      border-radius: 20px;
      background: radial-gradient(ellipse at center, #1c1004 0%, #110902 80%);
      box-shadow: 0 0 0 4px #3b2410, 0 0 0 10px #1a0f05, inset 0 0 60px rgba(255, 140, 0, 0.12), 0 24px 70px rgba(0, 0, 0, 0.7);
    }
    .crt::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, 0.22) 2px 3px);
    }
    #screen {
      margin: 0;
      overflow-x: auto;
      white-space: pre;
      font-size: clamp(10px, 1.85vw, 16px);
      line-height: 1.22;
      text-shadow: 0 0 3px rgba(255, 170, 50, 0.6), 0 0 12px rgba(255, 120, 0, 0.25);
    }
    .t-frame { color: #8f5c24; }
    .t-text { color: #ffb347; }
    .t-hi { color: #ffe9b8; font-weight: bold; }
    .t-dim { color: #a77a42; }
    .t-card { color: #ffe3bd; }
    .t-red { color: #ff6e4a; }
    .t-back { color: #7d4b1d; }
    .t-key { color: #ffc95e; font-weight: bold; }
    .t-win { color: #ffd640; font-weight: bold; }
    .t-alert { color: #ff5c3c; font-weight: bold; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      font: inherit;
      font-size: 14px;
      color: #ffc95e;
      background: #1f1206;
      border: 1px solid #8f5c24;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      text-shadow: 0 0 4px rgba(255, 170, 50, 0.5);
    }
    button:hover:not(:disabled), button:focus-visible { background: #3a2210; outline: 2px solid #ffc95e; outline-offset: 1px; }
    button[aria-pressed="true"] { color: #ff5c3c; border-color: #ff5c3c; }
    button:disabled { opacity: 0.4; cursor: default; }
    .hint { margin: 10px 0 0; font-size: 12px; color: #a77a42; }
  </style>
</head>
<body>
  <main class="crt">
    <pre id="screen" aria-live="polite">부트 힐에 전화 거는 중... (이 페이지는 JavaScript 모듈이 필요합니다. http로 폴더를 서비스하세요)</pre>
    <nav aria-label="조작">
      <button type="button" data-key="1" aria-pressed="false">[1] 카드</button>
      <button type="button" data-key="2" aria-pressed="false">[2] 카드</button>
      <button type="button" data-key="3" aria-pressed="false">[3] 카드</button>
      <button type="button" data-key="4" aria-pressed="false">[4] 카드</button>
      <button type="button" data-key="5" aria-pressed="false">[5] 카드</button>
      <button type="button" data-key="Enter">[ENTER] 뽑기</button>
      <button type="button" data-key="r">[R] 다시</button>
      <button type="button" data-key="n">[N] 새 패</button>
      <button type="button" data-key="q">[Q] 끊기</button>
    </nav>
    <p class="hint">키보드: 1-5 버리기/유지, Enter 뽑기, R 같은 시드로 다시, N 새 패, Q 끊기. 주소에 ?seed=17&amp;first=wizard를 붙이면 패를 고를 수 있습니다.</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
